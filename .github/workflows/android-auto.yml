name: Android Auto companion

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-auto.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-auto.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test, lint, and assemble Android Auto companion
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Print Android lint findings
        if: always()
        shell: bash
        run: |
          report="android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -f "$report" ]]; then
            cat "$report"
          else
            echo "No Android lint text report was generated."
          fi

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortimer-player-android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mortimer-player-android-auto-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
