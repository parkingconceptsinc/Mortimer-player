name: Android Auto companion

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-auto.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-auto.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble Android Auto companion
        working-directory: android
        run: gradle assembleDebug
